<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - Ruang Ujian</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style.mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon">👨‍🏫</div>
                <div class="logo-text">Ruang<span>Ujian</span></div>
            </div>
            <div class="nav-links">
                <a href="/index.html">Beranda</a>
                <a href="/dashboard.html" class="active">Login Guru</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🔐</div>
                <h2>Login Dashboard Guru</h2>
                <p>Masukkan kredensial untuk mengakses dashboard</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn-primary">Login →</button>
            </form>
            
            <div class="login-footer">
                <p>Demo: username: <strong>admin</strong> | password: <strong>admin123</strong></p>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
