<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online - Ruang Ujian</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style.mobile.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ujian-container">
        <div class="ujian-header">
            <div class="ujian-info">
                <h2 id="judulUjian"></h2>
                <p id="mapelUjian"></p>
            </div>
            <div class="timer-box">
                <div class="timer-label">⏱️ Sisa Waktu</div>
                <div class="timer" id="timer">00:00</div>
            </div>
        </div>

        <div class="ujian-content">
            <div class="soal-container" id="soalContainer"></div>
            <div class="ujian-sidebar">
                <div class="soal-nav" id="soalNav"></div>
                <button class="btn-submit" id="submitBtn">Submit Jawaban ✅</button>
            </div>
        </div>
    </div>

    <!-- Modal Hasil Ujian -->
    <div class="modal" id="hasilModal">
        <div class="modal-content modal-hasil">
            <div class="modal-header">
                <h3>📄 Bukti Hasil Ujian</h3>
                <button class="modal-close" onclick="closeHasilModal()">&times;</button>
            </div>
            <div class="modal-body" id="hasilBody"></div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="cetakBukti()">🖨️ Cetak Bukti</button>
                <button class="btn-secondary" onclick="kembaliKeBeranda()">🏠 Kembali ke Beranda</button>
            </div>
        </div>
    </div>

    <style>
        /* Style untuk soal essay */
        .soal-item.essay {
            background: #f8f9fa;
            border-left: 4px solid #10b981;
        }
        
        .essay-textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            margin-top: 1rem;
            transition: all 0.3s;
        }
        
        .essay-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .essay-label {
            font-weight: 600;
            color: #10b981;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        
        .essay-petunjuk {
            background: #e8f5e9;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #2e7d32;
            margin-top: 0.5rem;
        }
        
        .badge-esai {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
        
        .badge-pg {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }
    </style>

    <script src="/js/ujian.js"></script>
</body>
</html>
